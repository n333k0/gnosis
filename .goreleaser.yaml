version: 2

project_name: gnosis

builds:
  - id: gnosis
    main: ./cmd/gnosis
    binary: gnosis
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.Version={{ .Version }}

archives:
  - id: gnosis
    ids:
      - gnosis
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"

release:
  github:
    owner: n333k0
    name: gnosis
  footer: |
    ## Install

    ```bash
    curl -fsSL https://raw.githubusercontent.com/n333k0/gnosis/main/install.sh | bash
    ```
